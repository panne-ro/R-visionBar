    <!DOCTYPE html>
<html>

<head>
    <title>All Alcohols & Spirits</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/jpeg" href="./img/favicon.jpeg">
</head>

<body>

    <header>
        <h1>All Alcohols & Spirits</h1>
    </header>

    <main>

        <section id="accueil" class="page active">
            <h1 class="titre-accueil">All Alcohols & Spirits</h1>

            <div id="grille-accueil">
                <div class="carte-accueil" data-target="cocktail">
                    <p>Cocktails</p>
                </div>

                <div class="carte-accueil" data-target="spiritueux">
                    <p>Spiritueux</p>
                </div>

                <div class="carte-accueil" data-target="tiktok">
                    <p>Découverte</p>
                </div>

                <div class="carte-accueil" data-target="quizz">
                    <p>Quizz</p>
                </div>
            </div>
        </section>

        <section id="cocktail" class="page">
            <input type="text" id="recherche-cocktail" placeholder="Rechercher un cocktail...">

            <div id="grille-cocktails">
                <!-- Les cartes seront générées ici en JavaScript -->
            </div>

            <div id="detail-cocktail" class="cache">
                <button id="bouton-retour">← Retour</button>

                <h2 id="detail-nom"></h2>

                <div id="detail-contenu">
                    <img id="detail-photo" src="" alt="">
                    <div>
                        <h3 class="label-detail">Ingrédients :</h3>
                        <p id="detail-ingredients"></p>
                    </div>
                </div>

                <h3 class="label-detail">Description :</h3>
                <p id="detail-description"></p>
            </div>
        </section>

        <section id="spiritueux" class="page">
            <h2>Spiritueux</h2>
        </section>

        <section id="tiktok" class="page">
            <div id="feed-tiktok">
                <!-- Les cartes seront générées ici en JavaScript -->
            </div>
        </section>

        <section id="quizz" class="page">
            <h2>Quizz</h2>
        </section>

    </main>

    <nav id="menu">
        <button data-target="accueil">Accueil</button>
        <button data-target="cocktail">Cocktails</button>
        <button data-target="spiritueux">Spiritueux</button>
        <button data-target="tiktok">Tiktok</button>
        <button data-target="quizz">Quizz</button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
